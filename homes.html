eight:700}.room-status-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}.rooms-heading{font:700 15px Manrope;margin:22px 0 10px}.room-status-row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px}.room-status-row:last-child{border-bottom:0}.status-pill{border-radius:30px;padding:5px 9px;font-size:11px;font-weight:800}.status-pill.is-vacant{background:#e5f5e3;color:#216b46}.status-pill.is-occupied{background:#f0efeb;color:#62675f}.detail-contact{display:inline-block;text-decoration:none;margin-top:6px}.contact-note{padding:12px;background:#f2f6ee;border-radius:10px;color:#5d6d62;font-size:12px;margin-top:12px}textarea{font:inherit;resize:vertical}.dialog{width:min(510px,100%);background:white;border-radius:19px;padding:26px;max-height:90vh;overflow:auto}.dialoghead{display:flex;justify-content:space-between;align-items:start}.dialog h2{font:800 23px Manrope;margin:0}.close{border:0;background:#f0f3ed;border-radius:50%;width:34px;height:34px;font-size:20px}.dialog p{color:var(--muted);font-size:13px;line-height:1.5}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#48564d}.field input,.field select{border:1px solid #dce4da;border-radius:9px;padding:11px;outline-color:var(--green)}.paybox{grid-column:1/-1;background:#f2f6ee;border-radius:11px;padding:14px;font-size:12px;color:#536457;line-height:1.6}.paybox b{color:var(--green);font-size:14px}.form .primary{grid-column:1/-1}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);opacity:0;background:#163c2b;color:white;padding:13px 20px;border-radius:12px;transition:.25s;z-index:12;font-size:14px}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.hero-inner{grid-template-columns:1fr .65fr;gap:20px}.grid{grid-te </style></head><body>
<header class="topbar"><div class="brand"><span class="logo">⌂</span>campusnest</div><nav class="nav"><a href="campusnest.html">Welcome</a><a href="homes.html">Find a home</a><a href="landlord-verification.html">List a property</a></nav></header>

<main class="section" id="homes"><div class="section-head"><div><h2 id="homesHeading">Homes near campus</h2><div class="sub">Student spaces, with the details you need.</div></div><div class="controls"><input class="home-search" id="search" placeholder="Search area, room type, or rent" oninput="render()"><button class="filter active" id="allBtn" onclick="setVacancy(false)">All homes</button><button class="filter" id="vacBtn" onclick="setVacancy(true)">● Vacant now</button><select class="select" id="sort" onchange="render()"><option value="featured">Sort: Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div></div><div class="grid" id="grid"></div><div class="trust" id="how"><div><strong>Own a rental near Moi?</strong><p>Reach students looking for their next home. Add photos and availability in minutes.</p></div><button class="primary" onclick="location.href='landlord-verification.html'">List your property →</button></div></main><footer class="footer">CampusNest · Student housing for Moi University</footer>
<div class="modal" id="detailModal" onclick="if(event.target===this)closeDetails()"><div class="dialog detail-dialog"><div class="dialoghead"><div><div class="eyebrow">Home details</div><h2 id="detailTitle"></h2></div><button class="close" onclick="closeDetails()">×</button></div><div id="detailContent"></div></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>
let onlineMode=Boolean(window.campusNestBackendReady),listingsLoading=Boolean(window.campusNestBackendReady),homes=[],onlyVacant=false,selectedArea='';
async function loadSharedHomes(){if(!onlineMode)return;listingsLoading=true;render();const {data,error}=await window.campusNestClient.from('properties').select('id,name,area,property_type,monthly_rent_ksh,description,contact_phone,cover_photo_path,property_rooms(label,status)').order('created_at',{ascending:false});if(error){listingsLoading=false;document.getElementById('grid').innerHTML='<div class="no-results">Listings are temporarily unavailable. Please try again shortly.</div>';return}homes=data.map(p=>({id:p.id,name:p.name,area:p.area,place:p.area,type:p.property_type,rent:p.monthly_rent_ksh,rooms:(p.property_rooms||[]).map(r=>({label:r.label,status:r.status})),rating:'New',bath:'Contact landlord',phone:p.contact_phone,img:p.cover_photo_path?window.campusNestClient.storage.from('property-photos').getPublicUrl(p.cover_photo_path).data.publicUrl:'',description:p.description||''}));listingsLoading=false;render()}function getRooms(home){return Array.isArray(home.rooms)&&home.rooms.length?home.rooms:[{label:'Room 1',status:home.available?'vacant':'occupied'}]}
function vacancyCount(home){return getRooms(home).filter(room=>room.status==='vacant').length}
function hasVacancies(home){return vacancyCount(home)>0}
function roomSummary(home){let rooms=getRooms(home),vacant=vacancyCount(home);return vacant?`${vacant} vacant · ${rooms.length} rooms`:`Fully occupied · ${rooms.length} rooms`}function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setArea(area){selectedArea=area;document.getElementById('homesHeading').textContent=area?('Homes in '+area):'Homes near campus';render();document.getElementById('homes').scrollIntoView({behavior:'smooth'})}
function setVacancy(v){onlyVacant=v;document.getElementById('allBtn').classList.toggle('active',!v);document.getElementById('vacBtn').classList.toggle('active',v);render()}
function render(){if(!onlineMode){document.getElementById('grid').innerHTML='<div class="no-results"><b>Live listings are not connected yet.</b><br>CampusNest will show landlord-approved properties here once the shared service is configured.</div>';return}if(listingsLoading){document.getElementById('grid').innerHTML='<div class="no-results">Loading verified homes…</div>';return}let q=document.getElementById('search').value.toLowerCase(),sort=document.getElementById('sort').value;let arr=homes.filter(x=>(!onlyVacant||hasVacancies(x))&&(!selectedArea||x.place===selectedArea)&&(`${x.name} ${x.area} ${x.type} ${x.rent}`.toLowerCase().includes(q)));if(sort==='low')arr.sort((a,b)=>a.rent-b.rent);if(sort==='high')arr.sort((a,b)=>b.rent-a.rent);document.getElementById('grid').innerHTML=arr.length?arr.map(x=>`<article class="card"><div class="photo"><img src="${escapeHtml(x.img)}" alt="${escapeHtml(x.name)}" loading="lazy"><span class="badge ${hasVacancies(x)?'':'soon'}">${roomSummary(x)}</span><button class="heart" onclick="this.classList.toggle('on');this.textContent=this.classList.contains('on')?'♥':'♡'" aria-label="Save ${escapeHtml(x.name)}">♡</button></div><div class="cardbody"><div class="cardtop"><div><h3>${escapeHtml(x.name)}</h3><div class="loc">⌖ ${escapeHtml(x.area)}</div></div><div class="rating"><span>★</span> ${escapeHtml(x.rating||'New')}</div></div><div class="details"><span>▦ ${escapeHtml(x.type)}</span><span>♧ ${escapeHtml(x.bath||'Ask owner')}</span></div><div class="price-row"><div class="price">KSh ${Number(x.rent).toLocaleString()} <small>/ month</small></div><button class="view" onclick="showDetails('${escapeHtml(x.id)}')">View details</button></div></div></article>`).join(''):'<div class="no-results"><b>No approved homes match that search yet.</b><br>Try another area or switch off “Vacant now”.</div>'}
function showDetails(id){let x=homes.find(item=>item.id===id);if(!x)return;document.getElementById('detailTitle').textContent=x.name;let phone=x.phone?`<a class="primary detail-contact" href="tel:${escapeHtml(x.phone)}">Call owner · ${escapeHtml(x.phone)}</a>`:'<div class="contact-note">Contact the landlord for details.</div>';let roomRows=getRooms(x).map(room=>`<div class="room-status-row"><span>${escapeHtml(room.label)}</span><span class="status-pill ${room.status==='vacant'?'is-vacant':'is-occupied'}">${room.status==='vacant'?'Vacant':'Occupied'}</span></div>`).join('');document.getElementById('detailContent').innerHTML=`<img class="detail-photo" src="${escapeHtml(x.img)}" alt="${escapeHtml(x.name)}"><div class="detail-meta">⌖ ${escapeHtml(x.area)} · ${escapeHtml(x.type)}</div><div class="detail-price">KSh ${Number(x.rent).toLocaleString()} <small>/ month</small></div><p class="detail-description">${escapeHtml(x.description||'Ask the owner for more details about this home.')}</p><h3 class="rooms-heading">Room availability</h3><div class="room-status-list">${roomRows}</div>${phone} <div class="contact-note">Verify the property, rent, and availability in person before making any payment.</div>`;document.getElementById('detailModal').classList.add('show')}function closeDetails(){document.getElementById('detailModal').classList.remove('show')}
function addRoom(){let row=document.createElement('div');row.className='room-row';row.innerHTML='<input class="room-name" placeholder="Room / unit name" aria-label="Room name" required><select class="room-status" aria-label="Room status"><option value="vacant">Vacant</option><option value="occupied">Occupied</option></select><button class="remove-room" type="button" onclick="removeRoom(this)" aria-label="Remove room">×</button>';document.getElementById('roomRows').appendChild(row)}
function removeRoom(button){let rows=document.querySelectorAll('.room-row');if(rows.length>1)button.closest('.room-row').remove()}function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3300)}
if(location.hash){selectedArea=decodeURIComponent(location.hash.slice(1));document.getElementById('homesHeading').textContent='Homes in '+selectedArea}render();if(onlineMode)loadSharedHomes();
</script></body></html>
